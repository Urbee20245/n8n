name: Sync fork with upstream

on:
  schedule:
    # Poll daily for upstream changes, including new n8n releases.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    name: Sync master from n8n-io/n8n
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork
        run: gh repo sync Urbee20245/n8n --source n8n-io/n8n --branch master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
